spring.application.name=mindfull

# ── Koneksi Database H2 (Development Mode) ─────────────────────────────────────
# H2 embedded database untuk development tanpa perlu MySQL/Laragon running
spring.datasource.url=jdbc:h2:mem:mindfull_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (akses via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Konfigurasi JPA / Hibernate ──────────────────────────────────────────────
# create = Hibernate akan drop dan create ulang semua tabel saat startup
spring.jpa.hibernate.ddl-auto=create
# Tampilkan query SQL di console untuk debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect untuk H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Nonaktifkan open-in-view untuk menghindari lazy loading di luar transaksi
spring.jpa.open-in-view=false

# Defer datasource initialization untuk menghindari error saat database belum siap
spring.jpa.defer-datasource-initialization=true

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Midtrans Payment Gateway ──────────────────────────────────────────────────
# Konfigurasi untuk QRIS payment (sandbox mode untuk testing)
midtrans.server-key=SB-Mid-server-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
midtrans.client-key=SB-Mid-client-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
midtrans.is-production=false

# ── Konfigurasi Aplikasi MindFull ─────────────────────────────────────────────
# Token default untuk registrasi akun admin (ganti sebelum production!)
app.admin-token=MINDFULL-ADMIN-2026

# Harga per token dalam rupiah (1 token = Rp 1.000)
app.harga-per-token=1000
