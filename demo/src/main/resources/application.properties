spring.application.name=mindfull

# ── Koneksi Database MySQL (Laragon) ─────────────────────────────────────────
# Pastikan Laragon sudah aktif dan database 'mindfull_db' sudah dibuat
# via script database.sql di HeidiSQL
spring.datasource.url=jdbc:mysql://localhost:3306/mindfull_db?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Konfigurasi JPA / Hibernate ──────────────────────────────────────────────
# none = Hibernate tidak ubah struktur tabel (tabel dikelola manual via database.sql)
spring.jpa.hibernate.ddl-auto=none
# Tampilkan query SQL di console untuk debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect untuk MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Nonaktifkan open-in-view untuk menghindari lazy loading di luar transaksi
spring.jpa.open-in-view=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Midtrans Payment Gateway ──────────────────────────────────────────────────
# Konfigurasi untuk QRIS payment (sandbox mode untuk testing)
midtrans.server-key=SB-Mid-server-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
midtrans.client-key=SB-Mid-client-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
midtrans.is-production=false
