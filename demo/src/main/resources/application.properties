spring.application.name=mindfull

# ── Koneksi Database MySQL (Laragon) ─────────────────────────────────────────
# Pastikan Laragon sudah aktif dan database 'mindfull_2' sudah dibuat
# via script mindfull_2.sql di HeidiSQL
spring.datasource.url=jdbc:mysql://localhost:3306/mindfull_2?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Konfigurasi JPA / Hibernate ──────────────────────────────────────────────
# update = Hibernate otomatis membuat / memperbarui struktur tabel saat aplikasi dijalankan
spring.jpa.hibernate.ddl-auto=update
# Tampilkan query SQL di console untuk debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect untuk MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Nonaktifkan open-in-view untuk menghindari lazy loading di luar transaksi
spring.jpa.open-in-view=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Midtrans Payment Gateway ──────────────────────────────────────────────────
# Konfigurasi untuk QRIS payment (sandbox mode untuk testing)
midtrans.server-key=SB-Mid-server-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
midtrans.client-key=SB-Mid-client-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
midtrans.is-production=false

# ── Konfigurasi Aplikasi MindFull ─────────────────────────────────────────────
# Token default untuk registrasi akun admin (ganti sebelum production!)
app.admin-token=MINDFULL-ADMIN-2026

# Harga per token dalam rupiah (1 token = Rp 1.000)
app.harga-per-token=1000
