<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Health Report – MindFull</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         SIDEBAR NAVIGASI
         ══════════════════════════════════════════════════════ -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">🧠</div>
            MindFull
        </div>

        <div class="sidebar-profile">
            <div class="avatar"
                 th:text="${#strings.substring(session.namaUser, 0, 1)}">A</div>
            <div>
                <div class="profile-nama" th:text="${session.namaUser}">User</div>
                <div class="profile-role">Member</div>
            </div>
        </div>

        <div class="nav-section">Menu</div>

        <a th:href="@{/dashboard}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>
        <a th:href="@{/activity}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Activity Tracker
        </a>
        <a th:href="@{/topup}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Top Up Balance
        </a>
        <a th:href="@{/report}" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Health Report
        </a>
        <a th:href="@{/profile}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
        </a>

        <div class="sidebar-footer">
            <a th:href="@{/logout}" class="btn-logout">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </a>
        </div>
    </aside>

    <!-- ══════════════════════════════════════════════════════
         KONTEN UTAMA
         ══════════════════════════════════════════════════════ -->
    <main class="main">

        <div class="page-header">
            <div class="page-judul">Health Report</div>
            <div class="page-sub">Ringkasan kesehatan digital harian kamu</div>
        </div>

        <div class="card">
            <!-- Tombol generate laporan -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <div class="card-title" style="margin-bottom: 0;">Summary Report</div>
                <form th:action="@{/report/generate}" method="post">
                    <button type="submit" class="btn btn-primary">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
                        Generate Report
                    </button>
                </form>
            </div>

            <!-- Kotak laporan, muncul setelah tombol ditekan -->
            <div th:if="${laporan}" class="report-box" th:text="${laporan}"></div>

            <!-- Empty state jika laporan belum di-generate -->
            <div th:if="${laporan == null}"
                 style="display: flex; flex-direction: column; align-items: center;
                        padding: 48px 20px; color: var(--text-3);">
                <div style="font-size: 40px; margin-bottom: 12px;">📋</div>
                <div style="font-size: 14px; font-weight: 500; color: var(--text-2); margin-bottom: 6px;">
                    Laporan belum di-generate
                </div>
                <div style="font-size: 13px;">
                    Klik tombol <strong style="color: var(--text-2);">Generate Report</strong> di atas untuk melihat laporan harian kamu.
                </div>
            </div>
        </div>

    </main>

</body>
</html>
