<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – MindFull</title>
    <style>
        /* ── Reset & Base ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e1e;
            color: #dce8ff;
            min-height: 100vh;
            display: flex;
        }

        /* ── Panel Kiri (Branding) ── */
        .panel-brand {
            flex: 1;
            background: linear-gradient(135deg, #003c64 0%, #05143a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px;
        }
        .brand-logo   { font-size: 64px; }
        .brand-nama   { font-size: 38px; font-weight: bold; color: #00d2c8; }
        .brand-tagline {
            font-size: 13px;
            color: #8299c8;
            text-align: center;
            line-height: 1.6;
        }

        /* ── Panel Kanan (Form) ── */
        .panel-form {
            flex: 1;
            background: #0f1530;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Card Form ── */
        .card {
            background: #16203f;
            border-radius: 20px;
            padding: 36px 32px;
            width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .card-judul { font-size: 18px; font-weight: bold; color: #00d2c8; margin-bottom: 4px; }
        .card-sub   { font-size: 11px; color: #46608a; margin-bottom: 24px; }

        /* ── Form Input ── */
        .form-group   { margin-bottom: 14px; }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #0f1530;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #dce8ff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #00d2c8; }

        /* ── Tombol ── */
        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-cyan  { background: #00d2c8; color: white; }
        .btn-cyan:hover { background: #00b8af; }

        /* ── Link Register ── */
        .link-register {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            color: #8299c8;
            text-decoration: underline;
        }
        .link-register:hover { color: #00d2c8; }

        /* ── Notifikasi Alert ── */
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 12px;
        }
        .alert-error {
            background: rgba(255, 75, 110, 0.15);
            color: #ff4b6e;
            border: 1px solid rgba(255, 75, 110, 0.3);
        }
        .alert-success {
            background: rgba(50, 215, 140, 0.15);
            color: #32d78c;
            border: 1px solid rgba(50, 215, 140, 0.3);
        }
    </style>
</head>
<body>

    <!-- Panel kiri: branding aplikasi -->
    <div class="panel-brand">
        <div class="brand-logo">🧠</div>
        <div class="brand-nama">MindFull</div>
        <div class="brand-tagline">
            Track your digital habits.<br/>
            Nurture your mental wellbeing.
        </div>
    </div>

    <!-- Panel kanan: form login -->
    <div class="panel-form">
        <div class="card">
            <div class="card-judul">Welcome back</div>
            <div class="card-sub">Sign in to continue</div>

            <!-- Pesan error dari controller (login gagal) -->
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <!-- Pesan sukses dari controller (setelah register berhasil) -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- Form login, dikirim ke AuthController.doLogin() -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Username"
                           required/>
                </div>
                <div class="form-group">
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Password"
                           required/>
                </div>
                <button type="submit" class="btn btn-cyan">Sign In</button>
            </form>

            <!-- Link ke halaman register -->
            <a th:href="@{/register}" class="link-register">
                Don't have an account? Register
            </a>
        </div>
    </div>

</body>
</html>
