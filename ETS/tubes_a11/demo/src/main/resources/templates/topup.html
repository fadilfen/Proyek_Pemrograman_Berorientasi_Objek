<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Top Up Balance – MindFull</title>
    <!-- CSS bersama untuk semua halaman yang memiliki sidebar -->
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

    <!-- ── Sidebar Navigasi ── -->
    <div class="sidebar">
        <div class="sidebar-logo">🧠 MindFull</div>

        <!-- Blok avatar dan nama user dari session -->
        <div class="sidebar-avatar">
            <div class="avatar-circle"
                 th:text="${#strings.substring(session.namaUser, 0, 1)}">A</div>
            <div>
                <div class="avatar-nama" th:text="${session.namaUser}">User</div>
                <div class="avatar-role">Member</div>
            </div>
        </div>

        <div class="sidebar-divider"></div>
        <div class="nav-label">NAVIGATION</div>

        <!-- Menu navigasi, 'active' ditandai pada halaman saat ini -->
        <a th:href="@{/dashboard}" class="nav-item">🏠&nbsp; Dashboard</a>
        <a th:href="@{/activity}"  class="nav-item">📊&nbsp; Activity Tracker</a>
        <a th:href="@{/topup}"     class="nav-item active">💳&nbsp; Top Up Balance</a>
        <a th:href="@{/report}"    class="nav-item">📋&nbsp; Health Report</a>
        <a th:href="@{/profile}"   class="nav-item">👤&nbsp; Profile</a>

        <div class="sidebar-bottom">
            <a th:href="@{/logout}" class="btn-logout">⬅&nbsp; Logout</a>
        </div>
    </div>

    <!-- ── Konten Utama ── -->
    <div class="main">

        <!-- Header halaman -->
        <div>
            <div class="page-judul">Top Up Balance</div>
            <div class="page-sub">Add tokens to your account</div>
        </div>

        <!-- Pesan sukses atau error dari controller -->
        <div th:if="${success}" class="alert alert-success"
             style="margin-top: 16px;" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error"
             style="margin-top: 16px;" th:text="${error}"></div>

        <!-- Card form top up, ditengahkan -->
        <div class="center-wrap">
            <div class="card card-center">

                <div style="font-size: 18px; font-weight: bold; color: #dce8ff; margin-bottom: 18px;">
                    Top Up Details
                </div>

                <!-- Tampilkan saldo token saat ini -->
                <div style="margin-bottom: 16px; padding: 12px 16px;
                            background: rgba(0,210,200,0.08); border-radius: 8px; font-size: 13px;">
                    Current Balance:
                    <span style="color: #00d2c8; font-weight: bold;"
                          th:text="${user.token} + ' tokens'">50 tokens</span>
                </div>

                <!-- Form dikirim ke MainController.prosesTopUp() -->
                <form th:action="@{/topup/proses}" method="post">

                    <!-- Input jumlah token yang ingin ditambahkan -->
                    <div class="form-group">
                        <label class="form-label">Amount (Tokens)</label>
                        <input type="number"
                               name="jumlahKoin"
                               class="form-control"
                               placeholder="Contoh: 50"
                               min="1"
                               required/>
                    </div>

                    <!-- Pilihan metode pembayaran (sama dengan proyek GUI) -->
                    <div class="form-group">
                        <label class="form-label">Payment Method</label>
                        <select name="metodePembayaran" class="form-control">
                            <option>QRIS (Instant)</option>
                            <option>Bank Transfer</option>
                            <option>E-Wallet</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-green btn-full">
                        Process Top Up
                    </button>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
