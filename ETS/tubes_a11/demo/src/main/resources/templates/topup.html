<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Top Up Balance – MindFull</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         SIDEBAR NAVIGASI
         ══════════════════════════════════════════════════════ -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">🧠</div>
            MindFull
        </div>

        <div class="sidebar-profile">
            <div class="avatar"
                 th:text="${#strings.substring(session.namaUser, 0, 1)}">A</div>
            <div>
                <div class="profile-nama" th:text="${session.namaUser}">User</div>
                <div class="profile-role">Member</div>
            </div>
        </div>

        <div class="nav-section">Menu</div>

        <a th:href="@{/dashboard}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>
        <a th:href="@{/activity}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Activity Tracker
        </a>
        <a th:href="@{/topup}" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Top Up Balance
        </a>
        <a th:href="@{/report}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Health Report
        </a>
        <a th:href="@{/profile}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
        </a>
        <a th:href="@{/notifikasi}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Notifikasi
        </a>

        <div class="sidebar-footer">
            <a th:href="@{/logout}" class="btn-logout">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </a>
        </div>
    </aside>

    <!-- ══════════════════════════════════════════════════════
         KONTEN UTAMA
         ══════════════════════════════════════════════════════ -->
    <main class="main">

        <div class="page-header">
            <div class="page-judul">Top Up Balance</div>
            <div class="page-sub">Tambah token untuk mencatat lebih banyak aktivitas</div>
        </div>

        <!-- Pesan sukses atau error dari controller -->
        <div th:if="${success}" class="alert alert-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span th:text="${error}"></span>
        </div>

        <!-- Card form top up, ditengahkan -->
        <div class="center-wrap">
            <div class="card card-narrow">

                <!-- Tampilkan saldo token saat ini -->
                <div class="balance-box">
                    <div>
                        <div class="balance-label">Saldo Token Saat Ini</div>
                        <div class="balance-value" th:text="${user.token} + ' tokens'">50 tokens</div>
                    </div>
                    <div style="font-size: 28px;">🪙</div>
                </div>

                <div class="card-title">Detail Top Up</div>

                <!-- Form dikirim ke MainController.prosesTopUp() -->
                <form th:action="@{/topup/proses}" method="post">

                    <!-- Input jumlah token -->
                    <div class="form-group">
                        <label class="form-label">Jumlah Token</label>
                        <input type="number"
                               name="jumlahKoin"
                               class="form-control"
                               placeholder="Contoh: 50"
                               min="1"
                               required/>
                    </div>

                    <!-- Pilihan metode pembayaran -->
                    <div class="form-group">
                        <label class="form-label">Metode Pembayaran</label>
                        <select name="metodePembayaran" class="form-control">
                            <option>QRIS (Instant)</option>
                            <option>Bank Transfer</option>
                            <option>E-Wallet</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success btn-full">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                        Proses Top Up
                    </button>
                </form>

            </div>
        </div>

    </main>

</body>
</html>
