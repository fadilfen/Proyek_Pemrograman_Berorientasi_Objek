spring.application.name=mindfull

# ── Koneksi Database MySQL 8.4 (Laragon di D:\laragon) ──────────────────────
# Sesuaikan password jika Laragon dikonfigurasi dengan password tertentu
spring.datasource.url=jdbc:mysql://localhost:3306/mindfull_db?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Konfigurasi JPA / Hibernate ──────────────────────────────────────────────
# update = tabel otomatis dibuat/diperbarui saat aplikasi start
spring.jpa.hibernate.ddl-auto=update
# Tampilkan query SQL di console untuk debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect tidak perlu dispesifikasikan, Hibernate 6 otomatis mendeteksi MySQL
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Nonaktifkan open-in-view untuk menghindari query saat rendering view
spring.jpa.open-in-view=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
