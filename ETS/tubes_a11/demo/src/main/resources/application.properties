spring.application.name=mindfull

# ── Koneksi Database H2 In-Memory (untuk development) ──────────────────────
spring.datasource.url=jdbc:h2:mem:mindfull_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── Konfigurasi JPA / Hibernate ──────────────────────────────────────────────
# create-drop = tabel dibuat saat aplikasi start, dihapus saat aplikasi stop
spring.jpa.hibernate.ddl-auto=create-drop
# Tampilkan query SQL di console untuk debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect untuk H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Nonaktifkan open-in-view untuk menghindari query saat rendering view
spring.jpa.open-in-view=false

# ── Konfigurasi H2 Console (akses di http://localhost:8080/h2-console) ──────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Konfigurasi Thymeleaf ────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

